#cloud-config
preserve_hostname: false
manage_etc_hosts: true

write_files:
  - path: /run/portainer-edge/enrollment
    owner: root:root
    permissions: '0600'
    content: |
      REPLACE_WITH_EDGE_ID
      REPLACE_WITH_EDGE_KEY

runcmd:
  - - bash
    - -ceu
    - |
      chmod 0700 /run/portainer-edge
      if grep -q '^REPLACE_WITH_' /run/portainer-edge/enrollment; then
        echo "Set unique Edge enrollment credentials in vCenter"
        exit 1
      fi
      install -d -m 0700 /opt/vm-provisioning
      cd /opt/vm-provisioning
      curl -fsSL --retry 3 https://raw.githubusercontent.com/Shuryatko/Deploy_Soft/b4a9eec441c401860119c1fc757262c35b9f6937/VM-Provisioning/scripts/base.sh -o base.sh
      curl -fsSL --retry 3 https://raw.githubusercontent.com/Shuryatko/Deploy_Soft/b4a9eec441c401860119c1fc757262c35b9f6937/VM-Provisioning/scripts/docker.sh -o docker.sh
      curl -fsSL --retry 3 https://raw.githubusercontent.com/Shuryatko/Deploy_Soft/b4a9eec441c401860119c1fc757262c35b9f6937/VM-Provisioning/scripts/portainer-edge-agent.sh -o portainer-edge-agent.sh
      bash base.sh
      bash docker.sh
      bash portainer-edge-agent.sh
