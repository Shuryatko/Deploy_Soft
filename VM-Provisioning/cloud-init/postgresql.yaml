#cloud-config
preserve_hostname: false
manage_etc_hosts: true
runcmd:
  - - bash
    - -ceu
    - |
      install -d -m 0700 /opt/vm-provisioning
      cd /opt/vm-provisioning
      for script in base postgresql install-postgresql-expansion; do
        curl -fsSL --retry 3 "https://raw.githubusercontent.com/Shuryatko/Deploy_Soft/8579cc85dfea68446fed1aab5039fd0ce7372025/VM-Provisioning/scripts/$script.sh" -o "$script.sh"
      done
      bash base.sh
      bash postgresql.sh
      bash install-postgresql-expansion.sh
