#cloud-config
preserve_hostname: false
manage_etc_hosts: true

runcmd:
  - - bash
    - -ceu
    - |
      install -d -m 0700 /opt/vm-provisioning
      cd /opt/vm-provisioning
      curl -fsSL --retry 3 https://raw.githubusercontent.com/Shuryatko/Deploy_Soft/e0599714419322745a174e3db5925e979eaa4ebd/VM-Provisioning/scripts/base.sh -o base.sh
      curl -fsSL --retry 3 https://raw.githubusercontent.com/Shuryatko/Deploy_Soft/e0599714419322745a174e3db5925e979eaa4ebd/VM-Provisioning/scripts/docker.sh -o docker.sh
      curl -fsSL --retry 3 https://raw.githubusercontent.com/Shuryatko/Deploy_Soft/e0599714419322745a174e3db5925e979eaa4ebd/VM-Provisioning/scripts/portainer.sh -o portainer.sh
      bash base.sh
      bash docker.sh
      bash portainer.sh
